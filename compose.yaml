name: rv-dev-environment

services:
  smoke:
    build:
      context: ./infra/smoke
    image: rv-dev-environment/smoke:local
    environment:
      SMOKE_HTTP_PORT: "8080"
      SMOKE_ENVIRONMENT_LABEL: ${SMOKE_ENVIRONMENT_LABEL:?Set SMOKE_ENVIRONMENT_LABEL in your .env file (copy .env.example to .env).}
    ports:
      - "${SMOKE_HTTP_PORT:-8080}:8080"
    volumes:
      - smoke-data:/data
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

volumes:
  smoke-data:
